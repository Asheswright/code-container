    environment:
      - TZ=Australia/Brisbane
      - USER_PASSWORD=${USER_PASSWORD}
      - API_SERVER_ENABLED=true
      - API_SERVER_HOST=0.0.0.0
      - API_SERVER_KEY=ashley_api
      - API_SERVER_CORS_ORIGINS='*'
